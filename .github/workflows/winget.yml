name: WinGet package validation

on:
  push:
    branches: [main]
    paths:
      - 'winget/**'
      - 'scripts/*winget*.ps1'
      - '.github/workflows/winget.yml'
  pull_request:
    paths:
      - 'winget/**'
      - 'scripts/*winget*.ps1'
      - '.github/workflows/winget.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify publisher NSIS install and removal
        run: ./scripts/verify-installer.ps1
      - name: Native installer evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-installer-evidence
          if-no-files-found: ignore
          path: artifacts/native-installer-verification.json

  validate:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Prepare WinGet in the ephemeral runner
        shell: pwsh
        run: |
          trap {
            $taskFailure = $_.Exception.Message.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output ('::error title=WinGet bootstrap::' + $taskFailure)
            throw
          }
          $taskWingetVersion = [version]'0.0.0'
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            $taskVersionText = (winget --version) -join ''
            if ($LASTEXITCODE -eq 0) { $taskWingetVersion = [version]$taskVersionText.Trim().TrimStart('v') }
          }
          if ($taskWingetVersion -lt [version]'1.29.380') {
            $taskBundle = Join-Path $env:RUNNER_TEMP 'Microsoft.DesktopAppInstaller.msixbundle'
            $taskDependencyZip = Join-Path $env:RUNNER_TEMP 'DesktopAppInstaller_Dependencies.zip'
            $taskDependencies = Join-Path $env:RUNNER_TEMP 'DesktopAppInstaller_Dependencies'
            $taskReleaseBase = 'https://github.com/microsoft/winget-cli/releases/download/v1.29.380/'
            Invoke-WebRequest -Uri ($taskReleaseBase + 'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle') -OutFile $taskBundle
            Invoke-WebRequest -Uri ($taskReleaseBase + 'DesktopAppInstaller_Dependencies.zip') -OutFile $taskDependencyZip
            if ((Get-FileHash -LiteralPath $taskBundle -Algorithm SHA256).Hash -ine '65DEA9C01CE08EE7B763366B27C0E651F97DB857C11CA9B9C301826C10092F2E' -or (Get-FileHash -LiteralPath $taskDependencyZip -Algorithm SHA256).Hash -ine 'BA875AFE9D190F61218985AC0292A99D1DB710BF93E13C68944CA9D89F0D82D1') { throw 'Microsoft WinGet release checksum mismatch.' }
            Expand-Archive -LiteralPath $taskDependencyZip -DestinationPath $taskDependencies
            $taskDependencyPaths = @(Get-ChildItem -LiteralPath $taskDependencies -Recurse -File | Where-Object { $_.FullName -match 'x64' -and $_.Extension -in @('.appx','.msix') } | Select-Object -ExpandProperty FullName)
            if (-not $taskDependencyPaths.Count) { throw 'WinGet x64 dependencies are missing.' }
            Add-AppxPackage -Path $taskBundle -DependencyPath $taskDependencyPaths -ForceApplicationShutdown -ForceUpdateFromAnyVersion
            $taskPackage = Get-AppxPackage Microsoft.DesktopAppInstaller
            if ($taskPackage) {
              $env:PATH = $taskPackage.InstallLocation + ';' + $env:PATH
              $taskPackage.InstallLocation | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            }
          }
          $taskVersionText = (winget --version) -join ''
          if ($LASTEXITCODE -ne 0 -or [version]$taskVersionText.Trim().TrimStart('v') -lt [version]'1.29.380') { throw 'WinGet bootstrap did not select the required client version.' }
          Write-Output $taskVersionText
      - name: Validate manifest and public installer hash
        run: ./scripts/verify-winget.ps1 -VerifyInstaller
      - name: Test WinGet installation and removal
        run: ./scripts/verify-winget-install.ps1
      - name: Installation evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: winget-installation-evidence
          if-no-files-found: ignore
          path: artifacts/winget-install-verification.json
