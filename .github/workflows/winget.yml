name: WinGet package validation

on:
  push:
    branches: [main]
    paths:
      - 'winget/**'
      - 'scripts/*winget*.ps1'
      - '.github/workflows/winget.yml'
  pull_request:
    paths:
      - 'winget/**'
      - 'scripts/*winget*.ps1'
      - '.github/workflows/winget.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Prepare WinGet in the ephemeral runner
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          trap {
            $taskFailure = $_.Exception.Message.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output ('::error title=WinGet bootstrap::' + $taskFailure)
            throw
          }
          $taskWingetVersion = [version]'0.0.0'
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            $taskVersionText = (winget --version) -join ''
            if ($LASTEXITCODE -eq 0) { $taskWingetVersion = [version]$taskVersionText.Trim().TrimStart('v') }
          }
          if ($taskWingetVersion -lt [version]'1.29.380') {
            $taskModuleArchive = Join-Path $env:RUNNER_TEMP 'Microsoft.WinGet.Client.1.29.380.zip'
            $taskModuleDirectory = Join-Path $env:RUNNER_TEMP 'Microsoft.WinGet.Client.1.29.380'
            Invoke-WebRequest -Uri 'https://www.powershellgallery.com/api/v2/package/Microsoft.WinGet.Client/1.29.380' -OutFile $taskModuleArchive
            if ((Get-FileHash -LiteralPath $taskModuleArchive -Algorithm SHA256).Hash -ine '3469E5747EB6B100E51FED3F2057386B5BA60BC8955A6669B5C2EB562E316619') { throw 'Microsoft WinGet module checksum mismatch.' }
            Expand-Archive -LiteralPath $taskModuleArchive -DestinationPath $taskModuleDirectory
            Import-Module (Join-Path $taskModuleDirectory 'Microsoft.WinGet.Client.psd1')
            Repair-WinGetPackageManager -AllUsers -Version 1.29.380 -Force
            $taskPackage = Get-AppxPackage Microsoft.DesktopAppInstaller
            if ($taskPackage) {
              $env:PATH = $taskPackage.InstallLocation + ';' + $env:PATH
              $taskPackage.InstallLocation | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            }
          }
          $taskVersionText = (winget --version) -join ''
          if ($LASTEXITCODE -ne 0 -or [version]$taskVersionText.Trim().TrimStart('v') -lt [version]'1.29.380') { throw 'WinGet bootstrap did not select the required client version.' }
          Write-Output $taskVersionText
      - name: Validate manifest and public installer hash
        run: ./scripts/verify-winget.ps1 -VerifyInstaller
      - name: Test WinGet installation and removal
        run: ./scripts/verify-winget-install.ps1
      - name: Installation evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: winget-installation-evidence
          if-no-files-found: ignore
          path: artifacts/winget-install-verification.json
